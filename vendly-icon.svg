<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- V shape -->
  <path d="M30 40 L85 150 L140 40" 
        stroke="#0B2545" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Upward arrow integrated into V -->
  <path d="M85 150 L160 60" 
        stroke="#22C55E" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Arrow head -->
  <path d="M140 60 L160 60 L160 80" 
        fill="none" 
        stroke="#22C55E" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Chat bubble tail subtly integrated -->
  <path d="M75 150 Q85 170 100 150" 
        stroke="#0B2545" 
        stroke-width="10" 
        fill="none" 
        stroke-linecap="round"/>
</svg>